<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <title>PolSciTU</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- HERO -->
    <section class="hero">

        <div class="hero-bg"></div>

        <div class="container">
            <div class="hero-content">

                <p class="text-uppercase small text-white-50 mb-3">
                    1 ใน 4 คณะแรกเริ่มของมหาวิทยาลัยธรรมศาสตร์
                </p>

                <h1>
                    คณะรัฐศาสตร์<br>
                    มหาวิทยาลัยธรรมศาสตร์
                </h1>

                <p>
                    คณะรัฐศาสตร์ที่เก่าแก่ที่สุดแห่งหนึ่งของประเทศ
                </p>

                <button class="btn btn-light rounded-pill px-4 py-2 mt-3">
                    เพิ่มเติม
                </button>

            </div>
        </div>

    </section>


    <!-- CONTENT BELOW -->
    <section class="content">
        <div class="container">
            <h2>Scroll Down</h2>
            <p class="text-white-50">
                ส่วนนี้มีไว้ให้ลองเลื่อนหน้าเว็บเพื่อดูเอฟเฟกต์ Parallax
            </p>
        </div>
    </section>


    <!-- PARALLAX SCRIPT -->
    <script>
        const heroBg = document.querySelector(".hero-bg");

        window.addEventListener("scroll", () => {
            const scrollY = window.scrollY;

            heroBg.style.transform =
                `translateY(${scrollY * 0.35}px)`;
        });
    </script>

</body>

</html>
